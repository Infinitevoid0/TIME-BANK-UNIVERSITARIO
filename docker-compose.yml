version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: timebank-db
    restart: always
    environment:
      POSTGRES_DB: timebank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timebank"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./BancoTempo.Api
      dockerfile: Dockerfile
    container_name: timebank-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=timebank;Username=postgres;Password=postgrespassword
    ports:
      - "5067:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_uploads:/app/wwwroot/uploads

  frontend:
    build:
      context: ./banco-tempo-front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5067/api
    container_name: timebank-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  api_uploads:
    driver: local
